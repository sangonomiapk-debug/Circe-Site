<style>

*{
    margin:0;
    padding:0;

body{
    background:#2b0029;
    color:white;
    font-style:italic;

/* ====================== */
/* Inagemagem Banner 🖼️
/* ====================== */

#topo{
    position:sticky;
    top:0;
    z-index:100;
    background:#2b0029;
}

#topo img{
    width:100%;
    display:block;
}





/* ====================== */
/* Exibir Fotos 📷
/* ====================== */

#galeria{
    padding:15px;
}

.foto{
    width:100%;
    border-radius:18px;
    margin-bottom:18px;
    cursor:pointer;
    transition:.25s;
    display:block;
}

.foto:hover{
    transform:scale(1.01);
}





/* ====================== */
/* Exibir Tela Cheia 📤
/* ====================== */

#viewer{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.96);
    justify-content:center;
    align-items:center;
    z-index:999;
}





/* ====================== */
/* Botaoão de Fixar 📌
/* ====================== */

#viewer img{
    max-width:100%;
    max-height:100%;
}

#pinBtn{position:fixed;top:20px;right:20px;font-size:28px;background:#fff;border:none;border-radius:50%;padding:8px;display:none;z-index:1000;cursor:pointer}





/* ====================== */
/* Abas de videos / Fotos
/* ====================== */

#abas{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:12px;
    background:#2b0029;
    position:sticky;
    top:0;
    z-index:99;
}

.aba{
    background:#4a0047;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
}

.aba.ativa{
    background:#8f3cff;
}

// const pastaGithub="https://raw.githubusercontent.com/sangonomiapk-debug/Circe_fotos/main/";


const pastaGithub="https://raw.githubusercontent.com/sangonomiapk-debug/Circe-Mayer/main/";
const apiGithub="https://api.github.com/repos/sangonomiapk-debug/Circe-Mayer/contents/";
const galeria=document.getElementById("galeria");


let atual=0;
let pins=JSON.parse(localStorage.getItem("pins")||"[]");



async function render(){

    galeria.innerHTML="";

    try{

        const resposta = await fetch(apiGithub);
        const arquivos = await resposta.json();

        let ordem = arquivos
            .filter(arquivo =>
                arquivo.type === "file" &&
                /^Circe_Mayer \d+\.jpg$/i.test(arquivo.name)
            )
            .map(arquivo => {
                const numero = arquivo.name.match(/\d+/)[0];
                return Number(numero);
            })
            .sort((a,b)=>b-a);

        ordem.sort((a,b)=>{

            let pa=pins.includes(a);
            let pb=pins.includes(b);

            if(pa!=pb)
                return pb-pa;

            return b-a;
        });

        ordem.forEach(i=>{

            let img=document.createElement("img");

            img.src=pastaGithub+`Circe_Mayer ${i}.jpg`;

            img.className="foto";

            img.onclick=()=>{

                atual=i;

                imgGrande.src=img.src;

                viewer.style.display="flex";

                pinBtn.style.display="block";

            };

            galeria.appendChild(img);

        });

    }catch(erro){

        console.error("Erro ao carregar fotos:",erro);

        galeria.innerHTML=
            "<p style='text-align:center;padding:20px;'>Não foi possível carregar as fotos.</p>";

    }
}
 
 





render();
viewer.onclick=()=>{viewer.style.display="none";pinBtn.style.display="none";}
pinBtn.onclick=(e)=>{
 e.stopPropagation();
 if(!pins.includes(atual)) pins.push(atual); else pins=pins.filter(x=>x!=atual);
 localStorage.setItem("pins",JSON.stringify(pins));
 render();
};

function mostrarFotos(){
    document.querySelectorAll(".aba")[0].classList.add("ativa");
    document.querySelectorAll(".aba")[1].classList.remove("ativa");

    render();
}

function mostrarVideos(){

    document.querySelectorAll(".aba")[1].classList.add("ativa");
    document.querySelectorAll(".aba")[0].classList.remove("ativa");

    galeria.innerHTML="";

    videos.forEach(link=>{

        let video=document.createElement("video");

        video.src=link;
        video.controls=true;
        video.preload="metadata";
        video.className="foto";

        galeria.appendChild(video);

    });

}
